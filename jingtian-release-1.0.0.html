ath-report-page-1-cf06a19126f1.jpg", "sha256": "cf06a19126f13c85bf9ac7e5214a45e1aba010488c77bcb923e52c869c3607a5", "size": 459538, "targets": [{"name": "jingtian-lumi-1.0.0/assets/lu-tianshi-death-report-page-1-cf06a19126f1.jpg", "mode": 33188}, {"name": "jingtian-lumi-1.0.0/dist/assets/lu-tianshi-death-report-page-1-cf06a19126f1.jpg", "mode": 33188}]}, {"url": "/assets/lu-tianshi-death-report-page-2-259997b4b182.jpg", "sha256": "259997b4b18235b73838b5718373921b80f83bd3ccda12f6b8177bc81b4ccb0a", "size": 304097, "targets": [{"name": "jingtian-lumi-1.0.0/assets/lu-tianshi-death-report-page-2-259997b4b182.jpg", "mode": 33188}, {"name": "jingtian-lumi-1.0.0/dist/assets/lu-tianshi-death-report-page-2-259997b4b182.jpg", "mode": 33188}]}, {"url": "/assets/lu-tianshi-diary-1-dc369238122d.jpeg", "sha256": "dc369238122d6029b9a3d944f806b8060047a92b2280de2e521a3dedb80d0a42", "size": 625245, "targets": [{"name": "jingtian-lumi-1.0.0/assets/lu-tianshi-diary-1-dc369238122d.jpeg", "mode": 33188}, {"name": "jingtian-lumi-1.0.0/dist/assets/lu-tianshi-diary-1-dc369238122d.jpeg", "mode": 33188}]}, {"url": "/index.html", "sha256": "618869f6b9f1bdf679beeea96848b205df953949daa0f436e52fc2673c669124", "size": 1980234, "targets": [{"name": "jingtian-lumi-1.0.0/dist/index.html", "mode": 33188}, {"name": "jingtian-lumi-1.0.0/src/index.html", "mode": 33188}]}], "embedded": [{"name": "jingtian-lumi-1.0.0/AGENTS.md", "mode": 33188, "text": "# 工程说明\n\n这是现网游戏的独立发布快照。用户指定名称《京田市谜案调查》、正式版、版本 1.0.0、目标幻光文游社区文游发布区。\n\n游戏源码位于 src/index.html，资源在 assets/（平铺的图片、音频与 PDF），scripts/build.mjs 复制它们到 dist/。不要改动原站、剧情、谜题、导航或横竖屏布局，除非用户另外提出要求。\n\n发布前使用随 @66rpg/lumimaker 安装的官方说明；先构建，再按正式版流程发布。首次发布文案在 publish-copy.json。当前没有平台作品标识或发布成功记录，勿虚构。只发布正式作品，不发布模板、试玩或开源工程。出现不确定的提交结果时先确认状态，不重复提交。\n"}, {"name": "jingtian-lumi-1.0.0/README.md", "mode": 33188, "text": "# 京田市谜案调查 · 幻光正式版 1.0.0 发布工程\n\n这是从 https://jingtian-angel.love 于 2026-10-17 获取的现网快照及发布配置。当前状态：已整理发布材料，尚未登录幻光、上传、送审或公开发布。\n\n## 在 Mac 上继续\n\n1. 解压整个文件夹，保留所有文件和 assets 目录。\n2. 先查看 `publish-copy.json`；简介和正文根据当前游戏开场整理，可自行修改。\n3. 电脑需要 Node.js 20 或更新版本，且须使用具备作者权限的橙光账号。\n4. 双击 `发布到幻光.command`。若系统阻止打开，请保留系统提示，不要关闭安全保护；也可以在终端进入本文件夹后执行下面的命令。\n5. 按官方登录页面完成授权。发布时核对名称“京田市谜案调查”、版本“1.0.0”和“正式版”；游玩时长等未预填信息请按实际内容填写。\n6. 以官方返回状态为准。若返回审核中，等待审核；若帖子仍为草稿，进入社区完成作品资料并确认公开。\n\n```bash\nnpm install\nnpm run build\nnpx lumimaker login\nnpx lumimaker publish --content-file \"$PWD/publish-copy.json\"\n```\n\nWindows 可在本文件夹内安装依赖、构建和登录；最后一条命令须把文案路径替换为 `publish-copy.json` 的 Windows 绝对路径。\n\n## 文件与检查\n\n- `src/index.html`：原网站入口原样保存。\n- `assets/`：页面引用的图片、音频和 PDF。\n- `dist/`：已构建的正式版静态文件，官方工具上传此目录。\n- `封面.jpg`：从原游戏开场封面复制，供社区作品资料使用。\n- `package.json`：作品名称、1.0.0 版本及官方发布工具依赖。\n- `publish-copy.json`：首发简介和帖子正文。\n- `npm run validate`：检查资源是否齐全、单文件体积及内嵌脚本语法。\n- `npm run dev`：本机预览。\n\n源码与资源未改写剧情、谜题或交互。游戏内原有标题中的旧开发版本标记原样保留，幻光发布版本以 package.json 的 1.0.0 为准。\n\n发布工具 0.1.56 的官方说明目前只支持 Windows x64 与 macOS arm64/x64；本次整理环境为 Linux，因此没有执行上传，也没有验证幻光托管播放器中的完整流程。本地文件检查不代表平台审核通过。\n\n如果提交超时或结果不明确，先查看社区是否已有该版本，或运行 `npx lumimaker status-game`，不要盲目重复提交。同一版本发布成功后不要再次使用本脚本首发。\n\n本包只准备正式作品发布，不发布试玩版、模板或开源工程。\n"}, {"name": "jingtian-lumi-1.0.0/package.json", "mode": 33188, "text": "{\n  \"name\": \"京田市谜案调查\",\n  \"slug\": \"jingtian-mystery-investigation\",\n  \"version\": \"1.0.0\",\n  \"data_ver\": \"1\",\n  \"private\": true,\n  \"type\": \"module\",\n  \"scripts\": {\n    \"dev\": \"node scripts/preview.mjs\",\n    \"dev:demo\": \"node scripts/preview.mjs\",\n    \"build\": \"node scripts/build.mjs\",\n    \"build:demo\": \"node scripts/build.mjs\",\n    \"validate\": \"node scripts/validate.mjs\"\n  },\n  \"engines\": { \"node\": \">=20\" },\n  \"devDependencies\": { \"@66rpg/lumimaker\": \"0.1.56\" }\n}\n"}, {"name": "jingtian-lumi-1.0.0/publish-copy.json", "mode": 33188, "text": "{\n  \"summary\": \"扮演新入职警察罗鑫，从一封邮件开始，查阅聊天、日记与档案，追寻京田市一桩被封锁的谜案。\",\n  \"content\": \"《京田市谜案调查》\\n正式版 1.0.0\\n作者：Changing\\n\\n你是一个刚入职京田市公安局的警察，叫罗鑫，26岁。你偶然听说警局内有个谜案，但警局封锁了一切消息，只知道案件与一个叫陆添时的女孩有关。\\n\\n你对这个案子很好奇，所以经常在网上搜索，却始终没有找到什么线索。直到有一天，你收到了一封邮件。发件人是一个刚刚结束高考的男孩，叫陆添辰……\\n\\n这是一款以叙事和调查为核心的网页解谜作品。你将通过模拟电脑中的邮件、聊天记录、日记、网站与档案寻找线索，逐步拼合真相。\\n\\n游玩提示\\n本作品无恐怖内容及跳脸画面。\\n最后部分有一个谜题需要使用外部浏览器搜索。\\n谜题整体难度不高，部分密码可点击“忘记密码”获得提示。\\n作品内含音频，建议佩戴耳机，或在安静、无人的地方播放。\\n\\n本作品中的人物、地名、机构、案件、诊疗情节及相关设定均为虚构，仅用于互动叙事与解谜，不对应、不影射现实中的任何个人、组织或事件；如有雷同，纯属巧合。\\n\\n原网站：https://jingtian-angel.love\"\n}\n"}, {"name": "jingtian-lumi-1.0.0/scripts/build.mjs", "mode": 33188, "text": "import fs from 'node:fs';\nimport { fileURLToPath } from 'node:url';\nimport { validate } from './validate.mjs';\nvalidate();\nconst root = fileURLToPath(new URL('../', import.meta.url));\nfs.mkdirSync(root + 'dist', { recursive: true });\nfs.copyFileSync(root + 'src/index.html', root + 'dist/index.html');\nfs.cpSync(root + 'assets', root + 'dist/assets', { recursive: true });\nconsole.log('正式版 1.0.0 文件已构建到 dist。尚未上传或发布。');\n"}, {"name": "jingtian-lumi-1.0.0/scripts/preview.mjs", "mode": 33188, "text": "import http from 'node:http';\nimport fs from 'node:fs';\nimport path from 'node:path';\nimport { fileURLToPath } from 'node:url';\nconst root = fileURLToPath(new URL('../', import.meta.url));\nconst types = {'.html':'text/html; charset=utf-8','.jpg':'image/jpeg','.jpeg':'image/jpeg','.png':'image/png','.svg':'image/svg+xml','.mp3':'audio/mpeg','.pdf':'application/pdf'};\nhttp.createServer((req,res) => {\n  try {\n    const requested = decodeURIComponent(new URL(req.url, 'http://127.0.0.1').pathname);\n    const rel = requested === '/' || requested === '/index.html' ? 'src/index.html' : requested.replace(/^\\//, '');\n    if (rel !== 'src/index.html' && !rel.startsWith('assets/')) { res.writeHead(404).end(); return; }\n    const file = path.resolve(root, rel);\n    if (!file.startsWith(root) || !fs.existsSync(file) || !fs.statSync(file).isFile()) { res.writeHead(404).end(); return; }\n    res.writeHead(200, {'Content-Type':types[path.extname(file)] || 'application/octet-stream'});\n    fs.createReadStream(file).pipe(res);\n  } catch { res.writeHead(400).end(); }\n}).listen(4173, '127.0.0.1', () => console.log('本地预览：http://127.0.0.1:4173 （仅本机可访问，按 Control+C 结束）'));\n"}, {"name": "jingtian-lumi-1.0.0/scripts/validate.mjs", "mode": 33188, "text": "import fs from 'node:fs';\nimport path from 'node:path';\nimport { fileURLToPath } from 'node:url';\nimport vm from 'node:vm';\n\nexport function validate() {\n  const root = fileURLToPath(new URL('../', import.meta.url));\n  const source = fs.readFileSync(path.join(root, 'src/index.html'), 'utf8');\n  if (Buffer.byteLength(source) > 5 * 1024 * 1024) throw new Error('HTML 超过平台的 5MB 限制。');\n  const refs = [...new Set(source.match(/assets\\/[^\\s\"'\u003c>`\\\\)]+/g) || [])];\n  if (!refs.length) throw new Error('没有找到资源引用，请检查入口文件。');\n  let bytes = 0;\n  for (const ref of refs) {\n    const target = path.resolve(root, ref);\n    if (!target.startsWith(path.join(root, 'assets') + path.sep)) throw new Error('资源路径越界。');\n    const stat = fs.statSync(target);\n    const image = /\\.(png|jpg|jpeg|webp|gif|svg)$/i.test(ref);\n    if (!stat.isFile() || stat.size === 0) throw new Error('资源为空：' + ref);\n    if (stat.size >= (image ? 10 : 100) * 1024 * 1024) throw new Error('资源超过平台单文件上限：' + ref);\n    bytes += stat.size;\n  }\n  let scripts = 0;\n  for (const match of source.matchAll(/\u003cscript\\b([^>]*)>([\\s\\S]*?)\u003c\\/script\\s*>/gi)) {\n    if (/type\\s*=\\s*[\"'](?:application\\/ld\\+json|application\\/json)/i.test(match[1])) continue;\n    new vm.Script(match[2], { filename: 'game-inline-' + (++scripts) + '.js' });\n  }\n  console.log(`检查通过：${refs.length} 个本地资源，${scripts} 段脚本语法正常，资源约 ${(bytes/1024/1024).toFixed(1)}MB。`);\n}\n\nif (process.argv[1] && path.resolve(process.argv[1]) === fileURLToPath(import.meta.url)) validate();\n"}, {"name": "jingtian-lumi-1.0.0/发布到幻光.command", "mode": 33261, "text": "#!/bin/bash\nset -e\ncd -- \"$(dirname -- \"$0\")\"\ntrap 'code=$?; if [ \"$code\" -ne 0 ]; then echo \"操作停止。请保留上方提示，不要反复提交同一版本。\"; fi; read -r -p \"按回车关闭窗口。\"' EXIT\necho '《京田市谜案调查》正式版 1.0.0'\nif ! command -v node >/dev/null 2>&1 || ! command -v npm >/dev/null 2>&1; then\n  echo '请先安装 Node.js 20 或更新版本，再运行此文件。'\n  exit 1\nfi\nnode -e 'if(Number(process.versions.node.split(\".\")[0]) \u003c 20){console.error(\"需要 Node.js 20 或更新版本。\");process.exit(1)}'\nif [ -d .lumimaker ]; then\n  echo '此工程已有平台记录。请先在社区检查 1.0.0 是否已提交，避免重复发布。'\n  echo '可在此目录运行 npx lumimaker status-game 查询审核状态。'\n  exit 1\nfi\necho '请先查看 publish-copy.json 中的简介和帖子正文。'\nread -r -p '输入“发布”继续安装官方工具、登录并提交；其他输入取消：' answer\nif [ \"$answer\" != '发布' ]; then exit 0; fi\nnpm install --no-audit --no-fund\nnpm run build\nnpx lumimaker login\nnpx lumimaker publish --content-file \"$PWD/publish-copy.json\"\necho '请以上方官方结果为准：提交审核不等于已公开发布。'\n"}]};

const encoder = new TextEncoder();
const crcTable = new Uint32Array(256);
for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xedb88320^(c>>>1)):(c>>>1);crcTable[n]=c>>>0;}
function crc32(bytes){let c=0xffffffff;for(let i=0;i<bytes.length;i++)c=crcTable[(c^bytes[i])&255]^(c>>>8);return(c^0xffffffff)>>>0;}
function zipBlob(entries){
  const local=[],central=[];let offset=0,centralSize=0;
  for(const entry of entries){
    const name=encoder.encode(entry.name),data=entry.data,crc=crc32(data);
    const header=new Uint8Array(30+name.length),h=new DataView(header.buffer);
    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);
    h.setUint16(12,23889,true);h.setUint32(14,crc,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);h.setUint16(26,name.length,true);header.set(name,30);
    local.push(header,data);
    const center=new Uint8Array(46+name.length),d=new DataView(center.buffer);
    d.setUint32(0,0x02014b50,true);d.setUint16(4,0x0314,true);d.setUint16(6,20,true);d.setUint16(8,0x0800,true);
    d.setUint16(14,23889,true);d.setUint32(16,crc,true);d.setUint32(20,data.length,true);d.setUint32(24,data.length,true);d.setUint16(28,name.length,true);
    d.setUint32(38,(entry.mode*65536)>>>0,true);d.setUint32(42,offset,true);center.set(name,46);
    central.push(center);offset+=header.length+data.length;centralSize+=center.length;
  }
  const end=new Uint8Array(22),e=new DataView(end.buffer);e.setUint32(0,0x06054b50,true);
  e.setUint16(8,entries.length,true);e.setUint16(10,entries.length,true);e.setUint32(12,centralSize,true);e.setUint32(16,offset,true);
  return new Blob([...local,...central,end],{type:'application/zip'});
}
async function getResource(resource){
  let lastError;
  for(let attempt=0;attempt<3;attempt++){
    const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),45000);
    try{
      const response=await fetch(resource.url+'?release=1.0.0&hash='+resource.sha256.slice(0,12),{signal:controller.signal,cache:'no-cache'});
      if(!response.ok)throw new Error('下载请求未成功（'+response.status+'）：'+resource.url);
      const data=new Uint8Array(await response.arrayBuffer());
      if(data.length!==resource.size)throw new Error('文件未完整下载：'+resource.url);
      const digest=new Uint8Array(await crypto.subtle.digest('SHA-256',data));
      const sha=Array.from(digest,b=>b.toString(16).padStart(2,'0')).join('');
      if(sha!==resource.sha256)throw new Error('文件内容与发布版本不一致：'+resource.url);
      return data;
    }catch(error){lastError=error;}finally{clearTimeout(timer);}
  }
  throw lastError;
}
const button=document.getElementById('prepare'),status=document.getElementById('status'),progress=document.getElementById('progress'),download=document.getElementById('download');

    async function worker(){while(!failed){const index=cursor++;if(index>=release.resources.length)return;try{collected[index]=await getResource(release.resources[index]);done++;progress.value=done;status.textContent='已准备 '+done+' / '+release.resources.length+' 份文件';}catch(error){failed=error;return;}}}
    await Promise.all([worker(),worker(),worker(),worker()]);if(failed)throw failed;
    const entries=[];
    release.resources.forEach((resource,index)=>resource.targets.forEach(target=>entries.push({...target,data:collected[index]})));
    release.embedded.forEach(item=>entries.push({name:item.name,mode:item.mode,data:encoder.encode(item.text)}));
    const blob=zipBlob(entries);download.href=URL.createObjectURL(blob);download.download='jingtian-1.0.0.zip';
    download.textContent='下载 ZIP 发布包（'+(blob.size/1000000).toFixed(1)+' MB）';download.hidden=false;button.hidden=true;
